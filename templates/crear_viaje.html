{% extends 'base.html' %}
{% block title %}Crear Viaje - Transporte Nacional{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
    <h2 class="text-xl font-bold text-slate-900 mb-4">Programar Nuevo Viaje</h2>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Origen</label>
            <input type="text" name="origen" placeholder="Ej: Bogotá" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Destino</label>
            <input type="text" name="destino" placeholder="Ej: Medellín" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm">
        </div>
        <p class="text-xs text-slate-400">La fecha y hora de salida se programan automáticamente para la ventana de despacho de hoy.</p>
        <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 rounded-lg text-sm transition-all">
            Guardar y Crear Viaje
        </button>
    </form>
</div>
{% endblock %}
